<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Powered Mini SOC</title>

  <!-- Load our fake log data from the separate file -->
  <script src="sample_logs.js"></script>

  <style>
    /* ── Base ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', sans-serif;
      font-size: 14px;
      padding: 24px;
    }

    /* ── Header ── */
    h1 {
      font-size: 24px;
      color: #58a6ff;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #8b949e;
      margin-bottom: 24px;
    }

    /* ── Stat cards row ── */
    .cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px 24px;
      min-width: 150px;
      text-align: center;
    }
    .card .number {
      font-size: 32px;
      font-weight: bold;
      color: #58a6ff;
    }
    .card.danger .number { color: #f85149; }
    .card.warn  .number  { color: #d29922; }
    .card .label {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }

    /* ── Section titles ── */
    h2 {
      font-size: 16px;
      color: #e6edf3;
      margin-bottom: 10px;
      border-left: 3px solid #58a6ff;
      padding-left: 8px;
    }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; margin-bottom: 32px; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #21262d;
      color: #8b949e;
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
    }
    td { padding: 7px 12px; border-bottom: 1px solid #21262d; }
    tr:hover td { background: #161b22; }

    /* ── Alert severity badges ── */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.high   { background: #3d1a1a; color: #f85149; border: 1px solid #f85149; }
    .badge.medium { background: #2d2200; color: #d29922; border: 1px solid #d29922; }

    /* ── Suspicious rows in the log table ── */
    tr.suspicious td { background: #2a1515; color: #f85149; }
    tr.suspicious:hover td { background: #3d1a1a; }
  </style>
</head>
<body>

  <h1>🛡️ AI-Powered Mini SOC</h1>
  <p class="subtitle">Security Operations Center — Rule-Based Intrusion Detection Dashboard</p>

  <!-- Stat cards will be filled by JavaScript -->
  <div class="cards" id="cards"></div>

  <h2>🚨 Alerts Detected</h2>
  <div class="table-wrap">
    <table id="alert-table">
      <thead>
        <tr>
          <th>Alert Type</th>
          <th>Source IP</th>
          <th>Detail</th>
          <th>Severity</th>
        </tr>
      </thead>
      <tbody id="alert-body"></tbody>
    </table>
  </div>

  <h2>📋 All Log Entries <small style="color:#8b949e;font-weight:normal;">(red = suspicious)</small></h2>
  <div class="table-wrap">
    <table id="log-table">
      <thead>
        <tr>
          <th>Time</th>
          <th>IP Address</th>
          <th>User</th>
          <th>Status</th>
          <th>Port</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>

  <script>
    // ════════════════════════════════════════
    //  DETECTION ENGINE  (rule-based, no ML)
    // ════════════════════════════════════════

    // Rule 1 – Brute Force: 5+ failed logins from the same IP
    function detectBruteForce(logs) {
      const failCounts = {};  // { ip: count }
      logs.forEach(log => {
        if (log.status === "failed") {
          failCounts[log.ip] = (failCounts[log.ip] || 0) + 1;
        }
      });
      const alerts = [];
      for (const ip in failCounts) {
        if (failCounts[ip] >= 5) {
          alerts.push({
            type: "Brute Force",
            ip: ip,
            detail: failCounts[ip] + " failed login attempts",
            severity: "high"
          });
        }
      }
      return alerts;
    }

    // Rule 2 – Port Scan: same IP probing 4+ different ports
    function detectPortScan(logs) {
      const portSets = {};  // { ip: Set of ports }
      logs.forEach(log => {
        if (!portSets[log.ip]) portSets[log.ip] = new Set();
        portSets[log.ip].add(log.port);
      });
      const alerts = [];
      for (const ip in portSets) {
        if (portSets[ip].size >= 4) {
          alerts.push({
            type: "Port Scan",
            ip: ip,
            detail: portSets[ip].size + " different ports probed: " + [...portSets[ip]].join(", "),
            severity: "medium"
          });
        }
      }
      return alerts;
    }

    // ════════════════════════════════════════
    //  RUN DETECTION
    // ════════════════════════════════════════
    const bruteAlerts = detectBruteForce(LOGS);
    const scanAlerts  = detectPortScan(LOGS);
    const allAlerts   = [...bruteAlerts, ...scanAlerts];

    // Collect suspicious IPs so we can highlight rows in the log table
    const suspiciousIPs = new Set(allAlerts.map(a => a.ip));

    // Count failed logins for the stat card
    const failedCount = LOGS.filter(l => l.status === "failed").length;

    // ════════════════════════════════════════
    //  RENDER STAT CARDS
    // ════════════════════════════════════════
    document.getElementById("cards").innerHTML = `
      <div class="card">
        <div class="number">${LOGS.length}</div>
        <div class="label">Total Log Entries</div>
      </div>
      <div class="card warn">
        <div class="number">${failedCount}</div>
        <div class="label">Failed Logins</div>
      </div>
      <div class="card danger">
        <div class="number">${allAlerts.length}</div>
        <div class="label">Alerts Triggered</div>
      </div>
    `;

    // ════════════════════════════════════════
    //  RENDER ALERTS TABLE
    // ════════════════════════════════════════
    const alertBody = document.getElementById("alert-body");
    if (allAlerts.length === 0) {
      alertBody.innerHTML = '<tr><td colspan="4" style="color:#8b949e;">No alerts detected.</td></tr>';
    } else {
      allAlerts.forEach(a => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${a.type}</td>
          <td>${a.ip}</td>
          <td>${a.detail}</td>
          <td><span class="badge ${a.severity}">${a.severity.toUpperCase()}</span></td>
        `;
        alertBody.appendChild(row);
      });
    }

    // ════════════════════════════════════════
    //  RENDER LOG TABLE
    // ════════════════════════════════════════
    const logBody = document.getElementById("log-body");
    LOGS.forEach(log => {
      const row = document.createElement("tr");
      // Highlight rows from suspicious IPs in red
      if (suspiciousIPs.has(log.ip)) row.classList.add("suspicious");
      row.innerHTML = `
        <td>${log.time}</td>
        <td>${log.ip}</td>
        <td>${log.user}</td>
        <td>${log.status}</td>
        <td>${log.port}</td>
        <td>${log.action}</td>
      `;
      logBody.appendChild(row);
    });
  </script>

</body>
</html>
